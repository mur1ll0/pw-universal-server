services:
  # ============================================================================
  # 1. CAMADA DE BANCO DE DADOS & CACHE COMPARTILHADA
  # ============================================================================
  pw-postgres:
    image: postgres:16-alpine
    container_name: pw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pw_database
      POSTGRES_USER: pw_admin
      POSTGRES_PASSWORD: pw_secure_password_2026
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pw_postgres_data:/var/lib/postgresql/data
      - ../specs/01_DATABASE_SCHEMA_POSTGRES.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # A migração roda logo depois do esquema, **em banco novo**: o
      # `docker-entrypoint-initdb.d` só é executado quando o volume está vazio. Num banco
      # que já existe, aplicar à mão:
      #   docker compose exec -T pw-postgres psql -U pw_admin -d pw_database \
      #     < ../specs/02_MIGRACAO_COMPATIBILIDADE_MULTI_REALM.sql
      - ../specs/02_MIGRACAO_COMPATIBILIDADE_MULTI_REALM.sql:/docker-entrypoint-initdb.d/02_migracao.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pw_admin -d pw_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  pw-dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly:latest'
    container_name: pw-dragonfly
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pw_dragonfly_data:/data
    ulimits:
      memlock: -1

  # ============================================================================
  # 2. SERVIÇOS GLOBAIS (Autenticação, Unicidade & Painel Web)
  # ============================================================================
  pw-auth:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-auth
    container_name: pw-auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
      LISTEN_PORT: 29200
    depends_on:
      pw-postgres:
        condition: service_healthy
      pw-dragonfly:
        condition: service_started

  pw-admin-api:
    build:
      context: ../web-admin/backend
      dockerfile: Dockerfile
    container_name: pw-admin-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
      # Catálogo de layouts de elements.data (specs/elements_layouts/*.json) e as
      # correções conhecidas por realm (specs/elements_155/realm_155_overrides.json) --
      # o `elements_decoder.py` carrega isso em tempo de execução (ver
      # `_load_realm_elements_generic`/`HAS_GENERIC_READER`). Mesmo padrão de volume
      # read-only já usado pro `data/` acima; sem isto o decodificador cai de volta pro
      # comportamento antigo (só v7/1.2.6), sem quebrar, mas sem decodificar builds novas.
      - ../specs/elements_layouts:/app/specs/elements_layouts:ro
      - ../specs/elements_155:/app/specs/elements_155:ro
    depends_on:
      - pw-postgres
      - pw-dragonfly

  # ============================================================================
  # 3. REALM 1: PERFECT WORLD CLASSIC (Versão 1.2.6)
  # ============================================================================
  pw-realm-126:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-link
    container_name: pw-realm-126
    restart: unless-stopped
    environment:
      REALM_ID: realm_126
      GAME_VERSION: "1.2.6"
      GATEWAY_PORT: 29000
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
      # Onde fica o servidor de mundo deste realm. O `pw-link` conecta aqui para
      # entregar os subcomandos do mundo 3D (`C2SGamedataSend`, opcode 75) e receber
      # de volta o que o mundo manda ao jogador (`S2CGamedataSend`, 74).
      GS_BUS: pw-world-126:29100
    ports:
      - "29000:29000" # Porta pública do cliente 1.2.6
    volumes:
      - ../data/realm_126/config:/app/data/config:ro
    depends_on:
      - pw-auth
      - pw-world-126

  # O servidor de mundo do realm 1.2.6 (`gamed`). Note que ele **não tem `ports:`**:
  # o barramento entre daemons não é autenticado e não pode ser exposto ao jogador.
  # Ele só é alcançável pela rede interna do compose, pelo nome do serviço.
  pw-world-126:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-gs
    container_name: pw-world-126
    restart: unless-stopped
    environment:
      REALM_ID: realm_126
      GAME_VERSION: "1.2.6"
      WORLD_TAG: "1"
      BUS_LISTEN: 0.0.0.0:29100
      CONFIG_DIR: /app/data/config
      # `pw_gs=debug` liga a linha "mundo: subcomando N de <roleid>", que é a prova de
      # que o caminho cliente → pw-link → barramento → pw-gs está fechado. Enquanto os
      # subcomandos não forem tratados aqui, é o único sinal de que eles chegam.
      RUST_LOG: info,pw_gs=debug
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
    volumes:
      - ../data/realm_126/config:/app/data/config:ro
    depends_on:
      pw-postgres:
        condition: service_healthy
      pw-dragonfly:
        condition: service_started

  # ============================================================================
  # 4. REALM 2: PERFECT WORLD TIDES / GENESIS (Versão 1.4.8)
  # ============================================================================
  pw-realm-148:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-link
    container_name: pw-realm-148
    restart: unless-stopped
    environment:
      REALM_ID: realm_148
      GAME_VERSION: "1.4.8"
      GATEWAY_PORT: 29002
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
      GS_BUS: pw-world-148:29100
    ports:
      - "29002:29002" # Porta pública do cliente 1.4.8
    volumes:
      - ../data/realm_148/config:/app/data/config:ro
    depends_on:
      - pw-auth
      - pw-world-148

  # Servidor de mundo do realm 1.4.8. Sem `ports:` — barramento interno (ver 1.2.6).
  pw-world-148:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-gs
    container_name: pw-world-148
    restart: unless-stopped
    environment:
      REALM_ID: realm_148
      GAME_VERSION: "1.4.8"
      WORLD_TAG: "1"
      BUS_LISTEN: 0.0.0.0:29100
      CONFIG_DIR: /app/data/config
      # `pw_gs=debug` liga a linha "mundo: subcomando N de <roleid>", que é a prova de
      # que o caminho cliente → pw-link → barramento → pw-gs está fechado. Enquanto os
      # subcomandos não forem tratados aqui, é o único sinal de que eles chegam.
      RUST_LOG: info,pw_gs=debug
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
    volumes:
      - ../data/realm_148/config:/app/data/config:ro
    depends_on:
      pw-postgres:
        condition: service_healthy
      pw-dragonfly:
        condition: service_started

  # ============================================================================
  # 5. REALM 3: PERFECT WORLD ECLIPSE (Versão 1.5.3)
  # ============================================================================
  pw-realm-153:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-link
    container_name: pw-realm-153
    restart: unless-stopped
    environment:
      REALM_ID: realm_153
      GAME_VERSION: "1.5.3"
      GATEWAY_PORT: 29001
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
      GS_BUS: pw-world-153:29100
    ports:
      - "29001:29001" # Porta pública do cliente 1.5.3
    volumes:
      - ../data/realm_153/config:/app/data/config:ro
    depends_on:
      - pw-auth
      - pw-world-153

  # Servidor de mundo do realm 1.5.3. Sem `ports:` — barramento interno (ver 1.2.6).
  pw-world-153:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-gs
    container_name: pw-world-153
    restart: unless-stopped
    environment:
      REALM_ID: realm_153
      GAME_VERSION: "1.5.3"
      WORLD_TAG: "1"
      BUS_LISTEN: 0.0.0.0:29100
      CONFIG_DIR: /app/data/config
      # `pw_gs=debug` liga a linha "mundo: subcomando N de <roleid>", que é a prova de
      # que o caminho cliente → pw-link → barramento → pw-gs está fechado. Enquanto os
      # subcomandos não forem tratados aqui, é o único sinal de que eles chegam.
      RUST_LOG: info,pw_gs=debug
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
    volumes:
      - ../data/realm_153/config:/app/data/config:ro
    depends_on:
      pw-postgres:
        condition: service_healthy
      pw-dragonfly:
        condition: service_started

  # ============================================================================
  # 6. REALM 4: PERFECT WORLD EVOLVED (Versão 1.5.5, build v156 — base atual do projeto,
  #    ver "MUDANÇA DE BASE" em docs/ESTADO_E_RETOMADA.md)
  # ============================================================================
  pw-realm-155:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-link
    container_name: pw-realm-155
    restart: unless-stopped
    environment:
      REALM_ID: realm_155
      GAME_VERSION: "1.5.5"
      GATEWAY_PORT: 29003
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
      GS_BUS: pw-world-155:29100
    ports:
      - "29003:29003" # Porta pública do cliente 1.5.5
    volumes:
      - ../data/realm_155/config:/app/data/config:ro
    depends_on:
      - pw-auth
      - pw-world-155

  # Servidor de mundo do realm 1.5.5. Sem `ports:` — barramento interno (ver 1.2.6).
  pw-world-155:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-gs
    container_name: pw-world-155
    restart: unless-stopped
    environment:
      REALM_ID: realm_155
      GAME_VERSION: "1.5.5"
      WORLD_TAG: "1"
      BUS_LISTEN: 0.0.0.0:29100
      CONFIG_DIR: /app/data/config
      # `pw_gs=debug` liga a linha "mundo: subcomando N de <roleid>", que é a prova de
      # que o caminho cliente → pw-link → barramento → pw-gs está fechado. Enquanto os
      # subcomandos não forem tratados aqui, é o único sinal de que eles chegam.
      RUST_LOG: info,pw_gs=debug
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
    volumes:
      - ../data/realm_155/config:/app/data/config:ro
    depends_on:
      pw-postgres:
        condition: service_healthy
      pw-dragonfly:
        condition: service_started

  # ============================================================================
  # 7. REALM 5: PERFECT WORLD EVOLVED BR (mesma build 1.5.5, dados do client
  #    "1.5.5 BR" do Murillo — realm gêmeo do 155 pra comparar client EN×BR e isolar se
  #    um crash é do client ou do servidor. Ver docs/ESTADO_E_RETOMADA.md.)
  # ============================================================================
  pw-realm-155br:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-link
    container_name: pw-realm-155br
    restart: unless-stopped
    environment:
      REALM_ID: realm_155BR
      GAME_VERSION: "1.5.5"
      GATEWAY_PORT: 29004
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
      # Um só servidor de mundo com todos os mapas do realm (WORLD_TAGS no pw-world-155br):
      # ele descobre o mapa de cada personagem no banco. Separar um mapa pesado noutro
      # contêiner é `GS_BUS: 1=a:29100,161=b:29100` — ver crates/pw-gs/src/mapas.rs.
      GS_BUS: pw-world-155br:29100
    ports:
      - "29004:29004" # Porta pública do client 1.5.5 BR
    volumes:
      - ../data/realm_155BR/config:/app/data/config:ro
    depends_on:
      - pw-auth
      - pw-world-155br

  # Servidor de mundo do realm 1.5.5 BR, com os mapas 1 (`world`) e 161 (`a61`, onde todo
  # personagem novo nasce pelos moldes do `clsconfig` do pwserver_155v156). Um processo
  # para os dois, com os dados carregados uma vez — o equivalente do `./gs gs01 ... is61`
  # do original. Sem `ports:` — barramento interno (ver 1.2.6).
  pw-world-155br:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        CRATE_NAME: pw-gs
    container_name: pw-world-155br
    restart: unless-stopped
    environment:
      REALM_ID: realm_155BR
      GAME_VERSION: "1.5.5"
      WORLD_TAGS: "1,161"
      BUS_LISTEN: 0.0.0.0:29100
      CONFIG_DIR: /app/data/config
      RUST_LOG: info,pw_gs=debug
      DATABASE_URL: postgresql://pw_admin:pw_secure_password_2026@pw-postgres:5432/pw_database
      REDIS_URL: redis://pw-dragonfly:6379
    volumes:
      - ../data/realm_155BR/config:/app/data/config:ro
    depends_on:
      pw-postgres:
        condition: service_healthy
      pw-dragonfly:
        condition: service_started

volumes:
  pw_postgres_data:
  pw_dragonfly_data:
