<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Perfect World — pw-universal</title>
<style>
  :root { --fundo:#0f1726; --painel:#18233a; --borda:#2a3a5c; --texto:#e6ebf5; --suave:#9aa8c4; --ouro:#e8b848; --erro:#ff7b7b; --ok:#7bd88f; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--fundo); color: var(--texto); }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--ouro); }
  .sub { color: var(--suave); margin: 0 0 16px; }
  .painel { background: var(--painel); border: 1px solid var(--borda); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  label { display:block; color: var(--suave); font-size: 12px; margin: 8px 0 4px; }
  input, select { width:100%; padding: 7px 9px; background:#0c1322; color: var(--texto); border:1px solid var(--borda); border-radius:6px; font: inherit; }
  .linha { display:flex; gap: 8px; }
  .linha > * { flex: 1; }
  .botoes { display:flex; gap: 8px; flex-wrap: wrap; }
  button { padding: 9px 16px; border-radius: 6px; border: 1px solid var(--borda); background: #23324f; color: var(--texto); font: inherit; cursor: pointer; }
  button.principal { background: var(--ouro); color: #1a1405; border-color: var(--ouro); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .barra { height: 10px; background:#0c1322; border-radius: 5px; overflow: hidden; border:1px solid var(--borda); }
  .barra > div { height: 100%; width: 0; background: var(--ouro); transition: width .2s; }
  #etapa { color: var(--suave); font-size: 12px; margin-top: 6px; min-height: 18px; word-break: break-all; }
  #mensagem { margin-top: 8px; min-height: 20px; }
  .erro { color: var(--erro); } .ok { color: var(--ok); }
  #situacao { color: var(--suave); }
</style>
</head>
<body>
<main>
  <h1>Perfect World — pw-universal</h1>
  <p class="sub">Instala, atualiza, repara e abre o cliente da versão escolhida.</p>

  <div class="painel">
    <label for="servidor">Servidor de atualização</label>
    <input id="servidor" placeholder="http://127.0.0.1:8100">
    <div class="linha">
      <div>
        <label for="versao">Versão do cliente</label>
        <select id="versao"></select>
      </div>
      <div style="flex:0 0 auto; align-self:end"><button id="recarregar">Buscar versões</button></div>
    </div>
    <label for="pasta">Pasta do cliente (a pasta <b>element</b>)</label>
    <input id="pasta" placeholder="C:\Jogos\PW Universal 1.5.5\element">
    <p id="situacao"></p>
  </div>

  <div class="painel">
    <div class="botoes">
      <button id="jogar" class="principal">Jogar</button>
      <button id="instalar">Instalar / atualizar</button>
      <button id="reparar">Verificar e reparar</button>
    </div>
    <div style="margin-top:12px" class="barra"><div id="barra"></div></div>
    <div id="etapa"></div>
    <div id="mensagem"></div>
  </div>
</main>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = (id) => document.getElementById(id);
  let ocupado = false;

  function config() {
    return { servidor: $('servidor').value.trim(), versao: $('versao').value, pasta: $('pasta').value.trim() };
  }
  function mensagem(texto, classe) { const m = $('mensagem'); m.textContent = texto; m.className = classe || ''; }
  function travar(sim) {
    ocupado = sim;
    for (const b of document.querySelectorAll('button')) b.disabled = sim;
  }
  function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }

  async function salvar() { try { await invoke('salvar_config', { config: config() }); } catch (_) {} }

  async function atualizarSituacao() {
    const pasta = $('pasta').value.trim();
    if (!pasta) { $('situacao').textContent = 'Escolha a pasta onde o cliente fica (ou vai ficar).'; return; }
    try {
      const e = await invoke('estado', { pasta });
      if (!e) $('situacao').textContent = 'Nenhum cliente instalado por este launcher nesta pasta.';
      else if (e.numero === null) $('situacao').textContent = `Instalação do ${e.versao_cliente} interrompida: "Instalar / atualizar" retoma de onde parou.`;
      else $('situacao').textContent = `Cliente ${e.versao_cliente} instalado, versão ${e.numero}.`;
    } catch (err) { $('situacao').textContent = String(err); }
  }

  async function buscarVersoes(escolhida) {
    const sel = $('versao');
    sel.innerHTML = '';
    try {
      const lista = await invoke('versoes', { servidorUrl: $('servidor').value.trim() });
      for (const v of lista) { const o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); }
      if (escolhida && lista.includes(escolhida)) sel.value = escolhida;
      mensagem(lista.length ? '' : 'O servidor não tem nenhuma versão publicada.', lista.length ? '' : 'erro');
    } catch (err) { mensagem('Não foi possível falar com o servidor: ' + err, 'erro'); }
  }

  async function executar(comando, args) {
    if (ocupado) return;
    travar(true); mensagem('');
    $('barra').style.width = '0';
    await salvar();
    try {
      const r = await invoke(comando, args);
      if (typeof r === 'string') mensagem(r, 'ok');
      $('etapa').textContent = '';
    } catch (err) { mensagem(String(err), 'erro'); }
    travar(false);
    atualizarSituacao();
  }

  listen('progresso', (ev) => {
    const p = ev.payload;
    const pct = p.total ? Math.min(100, (100 * p.feito) / p.total) : 0;
    $('barra').style.width = pct.toFixed(1) + '%';
    const unidade = p.etapa.startsWith('verificando') || p.etapa.startsWith('reparando') ? `${p.feito} / ${p.total}` : `${mb(p.feito)} / ${mb(p.total)}`;
    $('etapa').textContent = p.total ? `${p.etapa} — ${unidade} (${pct.toFixed(0)}%)` : p.etapa;
  });

  $('recarregar').onclick = () => buscarVersoes($('versao').value);
  $('pasta').onchange = () => { salvar(); atualizarSituacao(); };
  $('servidor').onchange = () => { salvar(); buscarVersoes($('versao').value); };
  $('versao').onchange = salvar;
  $('instalar').onclick = () => {
    const c = config();
    if (!c.versao || !c.pasta) { mensagem('Escolha a versão e a pasta.', 'erro'); return; }
    executar('instalar_ou_atualizar', { servidorUrl: c.servidor, versao: c.versao, pasta: c.pasta });
  };
  $('reparar').onclick = () => executar('reparar', { servidorUrl: config().servidor, pasta: config().pasta });
  $('jogar').onclick = async () => {
    try { await invoke('jogar', { pasta: config().pasta }); mensagem('Jogo aberto.', 'ok'); }
    catch (err) { mensagem(String(err), 'erro'); }
  };

  (async () => {
    const c = await invoke('carregar_config');
    $('servidor').value = c.servidor; $('pasta').value = c.pasta;
    await buscarVersoes(c.versao);
    atualizarSituacao();
  })();
</script>
</body>
</html>
